<svg width="100%" height="auto" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Glow Orbs -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <!-- Animations in CDATA -->
    <style><![CDATA[
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.06); }
      }
      .floating {
        animation: float 4s ease-in-out infinite;
      }
      .pulsing-glow-1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 220px 100px;
      }
      .pulsing-glow-2 {
        animation: pulseGlow 7s ease-in-out infinite alternate-reverse;
        transform-origin: 900px 200px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .sub-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        font-weight: 500;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
      }
    ]]></style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#bg-gradient)" stroke="url(#border-gradient)" stroke-width="1.5" />
  <rect x="3" y="3" width="1194" height="314" rx="19" fill="url(#grid)" />

  <!-- Lights -->
  <circle cx="220" cy="110" r="190" fill="url(#glow-purple)" class="pulsing-glow-1" />
  <circle cx="950" cy="180" r="170" fill="url(#glow-cyan)" class="pulsing-glow-2" />

  <!-- LEFT COLUMN -->
  <g transform="translate(60, 42)">
    <rect width="210" height="28" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" />
    <text x="30" y="18.5" fill="#a1a1aa" class="badge-text">Available for new projects</text>
  </g>

  <text x="60" y="128" fill="#fafafa" font-size="50" class="title-text">
    Gustavo Rocha
    <tspan fill="#8b5cf6">.</tspan>
  </text>

  <text x="60" y="166" fill="#a1a1aa" font-size="19" class="sub-text">
    <tspan fill="#8b5cf6">&gt;</tspan> Full-Stack Developer <tspan fill="#52525b">|</tspan> <tspan fill="#e4e4e7">Java • Spring Boot • React</tspan>
  </text>

  <!-- Stack Pills -->
  <g transform="translate(60, 205)">
    <g transform="translate(0, 0)">
      <rect width="84" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="42" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">Java</text>
    </g>
    <g transform="translate(94, 0)">
      <rect width="118" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="59" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">Spring Boot</text>
    </g>
    <g transform="translate(222, 0)">
      <rect width="90" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="45" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">React</text>
    </g>
    <g transform="translate(322, 0)">
      <rect width="110" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="55" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(442, 0)">
      <rect width="90" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="45" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">MySQL</text>
    </g>
    <g transform="translate(542, 0)">
      <rect width="90" height="30" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="45" y="19.5" fill="#e4e4e7" class="badge-text" text-anchor="middle">Docker</text>
    </g>
  </g>

  <text x="60" y="275" fill="#71717a" font-size="13" class="sub-text">
    const focus = "Building scalable backends &amp; high quality web interfaces";
  </text>

  <!-- RIGHT COLUMN -->
  <g transform="translate(740, 36)" class="floating">
    <rect width="400" height="248" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect width="400" height="34" rx="12" fill="#18181b" />
    <rect y="22" width="400" height="12" fill="#18181b" />
    <line x1="0" y1="34" x2="400" y2="34" stroke="#27272a" stroke-width="1" />

    <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="17" r="4.5" fill="#22c55e" opacity="0.8" />
    <text x="200" y="21" fill="#71717a" font-size="12" class="sub-text" text-anchor="middle">developer.ts</text>

    <g transform="translate(24, 62)">
      <text x="0" y="0" fill="#6366f1" font-size="12.5" class="sub-text">const</text>
      <text x="46" y="0" fill="#fafafa" font-size="12.5" class="sub-text">developer = {</text>

      <text x="16" y="24" fill="#a1a1aa" font-size="12" class="sub-text">name:</text>
      <text x="64" y="24" fill="#34d399" font-size="12" class="sub-text">'Gustavo Rocha'</text><text x="180" y="24" fill="#a1a1aa" font-size="12" class="sub-text">,</text>

      <text x="16" y="48" fill="#a1a1aa" font-size="12" class="sub-text">backend:</text>
      <text x="86" y="48" fill="#f59e0b" font-size="12" class="sub-text">['Java', 'Spring Boot']</text><text x="268" y="48" fill="#a1a1aa" font-size="12" class="sub-text">,</text>

      <text x="16" y="72" fill="#a1a1aa" font-size="12" class="sub-text">frontend:</text>
      <text x="96" y="72" fill="#38bdf8" font-size="12" class="sub-text">['React', 'TypeScript']</text><text x="272" y="72" fill="#a1a1aa" font-size="12" class="sub-text">,</text>

      <text x="16" y="96" fill="#a1a1aa" font-size="12" class="sub-text">database:</text>
      <text x="96" y="96" fill="#34d399" font-size="12" class="sub-text">'MySQL'</text><text x="156" y="96" fill="#a1a1aa" font-size="12" class="sub-text">,</text>

      <text x="16" y="120" fill="#a1a1aa" font-size="12" class="sub-text">learning:</text>
      <text x="96" y="120" fill="#a855f7" font-size="12" class="sub-text">'Docker 🐳'</text>

      <text x="0" y="146" fill="#fafafa" font-size="12.5" class="sub-text">};</text>
      <text x="0" y="170" fill="#22c55e" font-size="11.5" class="sub-text">✓ Ready to build scalable systems</text>
    </g>
  </g>
</svg>
